    <script>
      (function() {
        var preloader = document.getElementById('vip-preloader');
        var dismissed = false;
        function dismissVIPPreloader() {
          if (dismissed || !preloader) return;
          dismissed = true;
          preloader.classList.add('vip-loaded');
          setTimeout(function() {
            if (preloader && preloader.parentNode) {
              preloader.parentNode.removeChild(preloader);
            }
          }, 600);
        }
        window.addEventListener('eventrye-ready', dismissVIPPreloader);
        window.addEventListener('load', function() {
          setTimeout(dismissVIPPreloader, 350);
        });
        // Safety fallback so user is never blocked
        setTimeout(dismissVIPPreloader, 1500);
      })();
    </script>
