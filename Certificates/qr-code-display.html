<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket QR Code · ORBIT-I</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-seal" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="16" r="12" fill="#B8892D"/></svg>
      <div class="brand-name">ORBIT-I<span>X</span></div>
    </div>
    <div>
      <div class="nav-group-label">QR Tickets</div>
      <ul class="nav-list">
        <li><a class="nav-link active" href="qr-tickets-list.html">🎫 Tickets List</a></li>
        <li><a class="nav-link" href="qr-scanner.html">📷 Scanner</a></li>
      </ul>
    </div>

    <div>
  <div class="nav-group-label">ID Cards</div>
  <ul class="nav-list">
    <li><a class="nav-link" href="id-cards-select.html">🪪 Select Attendees</a></li>
    <li><a class="nav-link" href="id-cards-templates.html">🎨 Templates</a></li>
    <li><a class="nav-link" href="id-cards-preview.html">👁 Preview &amp; Generate</a></li>
  </ul>
  </div>
<div>
      <div class="nav-group-label">Analytics</div>
      <ul class="nav-list">
        <li><a class="nav-link" href="analytics.html">📊 Dashboard</a></li>
      </ul>
    </div>
    
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title">
        <span class="eyebrow">QR Tickets</span>
        <h1 id="page-title">Ticket QR Code</h1>
      </div>
      <a href="qr-tickets-list.html" class="btn btn-ghost">← Back to list</a>
    </div>

    <div class="content">
      <div class="card card-pad">
        <div class="qr-display-card">
          <div class="qr-display-img" id="qr-target"></div>
          <div class="qr-display-name" id="attendee-name">—</div>
          <div class="qr-display-sub" id="attendee-sub">—</div>
          <div class="qr-display-code" id="attendee-code">—</div>
          <div class="flex gap-12 mt-16">
            <a href="#" class="btn btn-secondary btn-sm">⬇ Download</a>
            <button class="btn btn-secondary btn-sm">✉ Email to attendee</button>
          </div>
        </div>

        <div class="preview-meta" style="justify-content:center;margin-top:28px">
          <div class="meta-chip">Status <b id="attendee-status">—</b></div>
          <div class="meta-chip">Gate <b>Main Entrance</b></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  
  const TICKETS = {
    "TKT-2026-4471": { name: "Rai Muhammad Saeed", email: "raisaeed0707@gmail.com", type: "General Admission", status: "Checked-in" },
    "TKT-2026-4472": { name: "Abeera Fazal",  email: "fazalabeera@mail.com",   type: "VIP",                status: "Not Arrived" },
    "TKT-2026-4473": { name: "Sana Fatima",   email: "sana.fatima@mail.com",  type: "General Admission", status: "Checked-in" }
  };

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id') || "TKT-2026-4471";
  const ticket = TICKETS[id] || { name: "Unknown", email: "", type: "—", status: "—" };

  document.getElementById('page-title').textContent = "Ticket QR Code";
  document.getElementById('attendee-name').textContent = ticket.name;
  document.getElementById('attendee-sub').textContent = ticket.type + " · " + ticket.email;
  document.getElementById('attendee-code').textContent = id;
  document.getElementById('attendee-status').textContent = ticket.status;

  new QRCode(document.getElementById("qr-target"), {
    text: id,
    width: 220,
    height: 220,
    colorDark: "#14213D",
    colorLight: "#FBF6E9",
    correctLevel: QRCode.CorrectLevel.M
  });
</script>

</body>
</html>
