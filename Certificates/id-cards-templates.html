<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Card Templates · ORBIT-I</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-seal" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="16" r="12" fill="#B8892D"/></svg>
      <div class="brand-name">ORBIT-I<span>X</span></div>
    </div>
    <div>
      <div class="nav-group-label">ID Cards</div>
      <ul class="nav-list">
        <li><a class="nav-link" href="id-cards-select.html">🪪 Select Attendees</a></li>
        <li><a class="nav-link active" href="id-cards-templates.html">🎨 Templates</a></li>
        <li><a class="nav-link" href="id-cards-preview.html">👁 Preview &amp; Generate</a></li>
      </ul>
    </div>
    <div class="sidebar-footer">Signed in as<br><b style="color:#EDEFF5">Admin · Events Team</b></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title">
        <span class="eyebrow">ID Cards · Step 2</span>
        <h1>Choose a Template</h1>
      </div>
      <div class="topbar-actions">
        <a href="id-cards-select.html" class="btn btn-ghost">← Back</a>
        <button class="btn btn-gold" id="continue-btn">Continue to Preview →</button>
      </div>
    </div>

    <div class="content">
      <div class="card card-pad">
        <div class="idcard-grid" id="template-options" style="justify-content:center"></div>
      </div>
    </div>
  </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  const TEMPLATES = [
    { key:"classic", label:"Classic Gold" },
    { key:"modern",  label:"Modern Minimal" },
    { key:"elegant", label:"Elegant Ribbon" },
    { key:"bold",    label:"Bold Achievement" }
  ];

  const attendees = JSON.parse(localStorage.getItem('idcard_attendees') || "[]");
  const sample = attendees[0] || { name:"Sample Name", role:"Attendee" };
  const eventName = localStorage.getItem('idcard_event') || "DevCon Summit 2026";
  let chosenTemplate = localStorage.getItem('idcard_template') || "classic";

  const container = document.getElementById('template-options');

  function initials(name){ return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

  function renderOptions(){
    container.innerHTML = '';
    TEMPLATES.forEach(t => {
      const wrap = document.createElement('div');
      wrap.className = 'idcard-wrap';
      const isSelected = t.key === chosenTemplate;
      wrap.innerHTML = `
        <div class="idcard idcard-${t.key}" style="cursor:pointer; ${isSelected ? 'outline:3px solid var(--gold); outline-offset:3px;' : ''}" data-key="${t.key}">
          <div class="idcard-header">
            <div class="idcard-notch"></div>
            <div class="org">ORBIT-I</div>
            <b>${eventName}</b>
          </div>
          <div class="idcard-photo">${initials(sample.name)}</div>
          <div class="idcard-body">
            <div class="idcard-name">${sample.name}</div>
            <div class="idcard-role">${sample.role}</div>
            <div class="idcard-qr" data-qr-sample></div>
          </div>
          <div class="idcard-footer">ID-SAMPLE-0001</div>
        </div>
        <div style="font-weight:600;font-size:13.5px">${t.label}</div>
      `;
      container.appendChild(wrap);
    });

    document.querySelectorAll('.idcard-qr[data-qr-sample]').forEach(el => {
      new QRCode(el, { text:"SAMPLE", width:64, height:64, colorDark:"#14213D", colorLight:"#ffffff" });
    });

    document.querySelectorAll('.idcard').forEach(card => {
      card.addEventListener('click', function(){
        chosenTemplate = this.dataset.key;
        renderOptions();
      });
    });
  }

  document.getElementById('continue-btn').addEventListener('click', function(){
    localStorage.setItem('idcard_template', chosenTemplate);
    window.location.href = "id-cards-preview.html";
  });

  renderOptions();
});
</script>

</body>
</html>
