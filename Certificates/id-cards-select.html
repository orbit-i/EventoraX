<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Cards · ORBIT-I</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-seal" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="16" r="12" fill="#B8892D"/></svg>
      <div class="brand-name">ORBIT-I<span>X</span></div>
    </div>
    <div>
      <div class="nav-group-label">QR Tickets</div>
      <ul class="nav-list">
        <li><a class="nav-link" href="qr-tickets-list.html">🎫 Tickets List</a></li>
        <li><a class="nav-link" href="qr-scanner.html">📷 Scanner</a></li>
      </ul>
    </div>
    <div>
      <div class="nav-group-label">ID Cards</div>
      <ul class="nav-list">
        <li><a class="nav-link active" href="id-cards-select.html">🪪 Select Attendees</a></li>
        <li><a class="nav-link" href="id-cards-templates.html">🎨 Templates</a></li>
        <li><a class="nav-link" href="id-cards-preview.html">👁 Preview &amp; Generate</a></li>
      </ul>
    </div>
    <div class="sidebar-footer">Signed in as<br><b style="color:#EDEFF5">Admin · Events Team</b></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title">
        <span class="eyebrow">ID Cards · Step 1</span>
        <h1>Select Event &amp; Attendees</h1>
      </div>
      <button class="btn btn-gold" id="continue-btn" disabled>Continue to Template →</button>
    </div>

    <div class="content">
      <div class="event-select-bar">
        <label for="event-select" style="font-weight:600;font-size:13px">Event:</label>
        <select id="event-select">
          <option>Web Development 2026</option>
          <option>ORBIT-I Batch 1</option>
          <option>Web Development Team</option>
        </select>
        <span class="text-soft" id="selected-count-text">0 attendees selected</span>
      </div>

      <div class="card">
        <div class="card-header">
          <div>
            <h2>Attendees</h2>
            <div class="desc">Choose who needs an ID card generated.</div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="checkbox-cell"><input type="checkbox" id="select-all-attendees" class="select-all-checkbox"></th>
                <th>Attendee</th>
                <th>Role</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody id="attendee-rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){

  const ATTENDEES = [
    { id:"ATD-001", name:"Rai Saeed",     email:"raisaeed0707@gmail.com", role:"Attendee" },
    { id:"ATD-002", name:"Abeera Fazal",  email:"fazalabeera@mail.com",   role:"VIP" },
    { id:"ATD-003", name:"Sana Fatima",   email:"sana.fatima@mail.com",  role:"Attendee" },
    { id:"ATD-004", name:"Bilal Khan",    email:"bilal.khan@mail.com",   role:"Speaker" },
    { id:"ATD-005", name:"Hamza Malik",   email:"hamza.malik@mail.com",  role:"Staff" },
    { id:"ATD-006", name:"Zara Nasir",    email:"zara.nasir@mail.com",   role:"Attendee" }
  ];

  const rowsBody = document.getElementById('attendee-rows');
  const selectAll = document.getElementById('select-all-attendees');
  const continueBtn = document.getElementById('continue-btn');
  const countText = document.getElementById('selected-count-text');
  const eventSelect = document.getElementById('event-select');
  const selected = new Set();

  function initials(name){ return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

  function render(){
    rowsBody.innerHTML = '';
    ATTENDEES.forEach(a => {
      const tr = document.createElement('tr');
      const checked = selected.has(a.id) ? 'checked' : '';
      tr.innerHTML = `
        <td class="checkbox-cell"><input type="checkbox" class="row-checkbox" data-id="${a.id}" ${checked}></td>
        <td>
          <div class="recipient">
            <div class="avatar">${initials(a.name)}</div>
            <div><div class="recipient-name">${a.name}</div></div>
          </div>
        </td>
        <td>${a.role}</td>
        <td class="text-soft">${a.email}</td>`;
      rowsBody.appendChild(tr);
    });

    document.querySelectorAll('.row-checkbox').forEach(cb => {
      cb.addEventListener('change', function(){
        if(this.checked) selected.add(this.dataset.id);
        else selected.delete(this.dataset.id);
        updateUI();
      });
    });
  }

  function updateUI(){
    countText.textContent = `${selected.size} attendee${selected.size===1?'':'s'} selected`;
    continueBtn.disabled = selected.size === 0;
    selectAll.checked = selected.size === ATTENDEES.length;
  }

  selectAll.addEventListener('change', function(){
    if(this.checked) ATTENDEES.forEach(a => selected.add(a.id));
    else selected.clear();
    render();
    updateUI();
  });

  continueBtn.addEventListener('click', function(){
    const chosen = ATTENDEES.filter(a => selected.has(a.id));
    localStorage.setItem('idcard_event', eventSelect.value);
    localStorage.setItem('idcard_attendees', JSON.stringify(chosen));
    window.location.href = "id-cards-templates.html";
  });

  render();
  updateUI();
});
</script>

</body>
</html>
