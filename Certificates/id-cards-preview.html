<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Cards Preview · ORBIT-I</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-seal" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="16" r="12" fill="#B8892D"/></svg>
      <div class="brand-name">ORBIT-I<span>X</span></div>
    </div>
    <div>
      <div class="nav-group-label">ID Cards</div>
      <ul class="nav-list">
        <li><a class="nav-link" href="id-cards-select.html">🪪 Select Attendees</a></li>
        <li><a class="nav-link" href="id-cards-templates.html">🎨 Templates</a></li>
        <li><a class="nav-link active" href="id-cards-preview.html">👁 Preview &amp; Generate</a></li>
      </ul>
    </div>
    <div>
      <div class="nav-group-label">Analytics</div>
      <ul class="nav-list">
        <li><a class="nav-link" href="analytics.html">📊 Dashboard</a></li>
      </ul>
    </div>
    
    <div class="sidebar-footer">Signed in as<br><b style="color:#EDEFF5">Admin · Events Team</b></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title">
        <span class="eyebrow">ID Cards · Step 3</span>
        <h1>Preview &amp; Generate</h1>
      </div>
      <div class="topbar-actions">
        <a href="id-cards-templates.html" class="btn btn-ghost">← Change template</a>
        <button class="btn btn-gold" id="download-all-btn">⬇ Download All (ZIP)</button>
      </div>
    </div>

    <div class="content">
      <div class="banner banner-info mb-16" id="empty-warning" style="display:none">
        Sheet not selected. <a href="id-cards-select.html" style="text-decoration:underline;font-weight:600">attendees select</a> karein.
      </div>

      <div class="idcard-grid" id="card-list"></div>
    </div>
  </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  const attendees = JSON.parse(localStorage.getItem('idcard_attendees') || "[]");
  const eventName = localStorage.getItem('idcard_event') || "DevCon Summit 2026";
  const template = localStorage.getItem('idcard_template') || "classic";

  const cardList = document.getElementById('card-list');
  const emptyWarning = document.getElementById('empty-warning');
  const downloadAllBtn = document.getElementById('download-all-btn');

  if(attendees.length === 0){
    emptyWarning.style.display = 'flex';
    downloadAllBtn.disabled = true;
    return;
  }

  function initials(name){ return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

  attendees.forEach((a, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'idcard-wrap';
    wrap.innerHTML = `
      <div class="idcard idcard-${template}" id="card-${idx}">
        <div class="idcard-header">
          <div class="idcard-notch"></div>
          <div class="org">ORBIT-I</div>
          <b>${eventName}</b>
        </div>
        <div class="idcard-photo">${initials(a.name)}</div>
        <div class="idcard-body">
          <div class="idcard-name">${a.name}</div>
          <div class="idcard-role">${a.role}</div>
          <div class="idcard-qr" data-qr="${a.id}"></div>
        </div>
        <div class="idcard-footer">${a.id}</div>
      </div>
      <button class="btn btn-secondary btn-sm" data-download-single="${idx}">⬇ Download PNG</button>
    `;
    cardList.appendChild(wrap);
  });

  document.querySelectorAll('.idcard-qr[data-qr]').forEach(el => {
    new QRCode(el, { text: el.dataset.qr, width:64, height:64, colorDark:"#14213D", colorLight:"#ffffff" });
  });

  async function downloadCardAsPng(cardEl, fileName){
    const canvas = await html2canvas(cardEl, { backgroundColor: null, scale: 2 });
    return new Promise(resolve => {
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fileName;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        resolve();
      }, 'image/png');
    });
  }

  document.querySelectorAll('[data-download-single]').forEach(btn => {
    btn.addEventListener('click', async function(){
      const idx = this.dataset.downloadSingle;
      const a = attendees[idx];
      const cardEl = document.getElementById('card-' + idx);
      this.textContent = "Generating…";
      await downloadCardAsPng(cardEl, a.name.replace(/\s+/g,'_') + '_IDCard.png');
      this.textContent = "⬇ Download PNG";
    });
  });

  downloadAllBtn.addEventListener('click', async function(){
    this.textContent = "Preparing ZIP…";
    this.disabled = true;
    try{
      const zip = new JSZip();
      const folder = zip.folder("EventoraX-ID-Cards");
      for(let i = 0; i < attendees.length; i++){
        const cardEl = document.getElementById('card-' + i);
        const canvas = await html2canvas(cardEl, { backgroundColor: null, scale: 2 });
        const dataUrl = canvas.toDataURL('image/png');
        const base64 = dataUrl.split(',')[1];
        folder.file(attendees[i].name.replace(/\s+/g,'_') + '_IDCard.png', base64, { base64:true });
      }
      const content = await zip.generateAsync({ type:"blob" });
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url; a.download = "eventorax-id-cards.zip";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }catch(err){
      console.error(err);
      alert();
    }finally{
      this.textContent = "⬇ Download All (ZIP)";
      this.disabled = false;
    }
  });
});
</script>

</body>
</html>
