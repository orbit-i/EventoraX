# ==============================================================================
# EVENTRYE / EVENTORAX HIGH-CONCURRENCY LOAD BALANCER & REVERSE PROXY CONFIGURATION
# Designed for production deployment at eventorax.orbit-i.tech & custom tenant domains
# ==============================================================================

# 1. High-Performance Upstream Cluster Pool
# Distributes traffic across local Node.js process cluster using least_conn algorithm
upstream eventorax_upstream_cluster {
    least_conn; # Routes requests to backend instance with fewest active connections
    
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5003 max_fails=3 fail_timeout=10s;
    
    # Maintain keep-alive connections to backend pool to eliminate TCP handshake latency
    keepalive 64;
}

# 2. Rate Limiting Zones (DDoS and brute-force mitigation)
limit_req_zone $binary_remote_addr zone=eventorax_api_zone:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=eventorax_auth_zone:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=eventorax_conn_zone:10m;

# 3. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name eventorax.orbit-i.tech *.orbit-i.tech;

    # ACME Challenge for Let's Encrypt SSL certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 4. HTTPS Main Application & API Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eventorax.orbit-i.tech *.orbit-i.tech;

    # SSL Configuration (Replace with production certificate paths)
    ssl_certificate /etc/letsencrypt/live/eventorax.orbit-i.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eventorax.orbit-i.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Max body upload size for event videos & high-resolution gallery images (100MB)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Gzip & Static Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Root Directory for compiled frontend assets
    root /var/www/eventorax/dist;
    index index.html;

    # 4.1 Strict Protection: Block access to .env, .git, and config files
    location ~* (\.env|\.git|\.htaccess|local_store\.json|\.bak|\.sql|\.pem|\.key)$ {
        deny all;
        return 403;
    }

    # 4.2 Static Media Uploads Caching (/uploads/events & /uploads/videos)
    location /uploads/ {
        alias /var/www/eventorax/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # 4.3 Static Assets Caching (Vite hashed JS/CSS assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 4.4 High-Security Authentication Endpoint Routing
    location /api/auth/ {
        limit_req zone=eventorax_auth_zone burst=10 nodelay;
        limit_conn eventorax_conn_zone 10;

        proxy_pass http://eventorax_upstream_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4.5 General API Cluster Routing with Rate Limiting
    location /api/ {
        limit_req zone=eventorax_api_zone burst=50 nodelay;
        limit_conn eventorax_conn_zone 25;

        proxy_pass http://eventorax_upstream_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout configurations to prevent backend hanging
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 4.6 Frontend SPA Client-Side Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
