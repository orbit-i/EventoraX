name: Checks

# Runs the same checks we run by hand before every commit.
on:
  push:
    branches: [main, integration/v1]
  pull_request:
    branches: [main, integration/v1]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (build + knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx knip

  backend:
    name: Backend (typecheck + knip)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Only needed so Prisma can load its config; no database is used.
      DATABASE_URL: mysql://ci:ci@localhost:3306/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx knip
